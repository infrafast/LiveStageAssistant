name: Decommission legacy pyttsx3

on:
  push:
    branches: [realtime-voice-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0

      - name: Migrate Classic local fallback to Piper
        run: python scripts/decommission_pyttsx3_migration.py

      - name: Normalize asserted block boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('voice_assistant/agent.py')
          s = p.read_text()
          duplicate_class = 'class AutoNetworkMonitor:\n\n\nclass AutoNetworkMonitor:\n'
          signature = '    def play_local_tts_file(self, audio_path: str | Path, *, stop_event: threading.Event | None = None) -> None:\n'
          duplicate_method = signature + '\n' + signature
          if s.count(duplicate_class) != 1:
              raise SystemExit(f'expected one duplicated AutoNetworkMonitor boundary, found {s.count(duplicate_class)}')
          if s.count(duplicate_method) != 1:
              raise SystemExit(f'expected one duplicated local-TTS method boundary, found {s.count(duplicate_method)}')
          s = s.replace(duplicate_class, 'class AutoNetworkMonitor:\n', 1)
          s = s.replace(duplicate_method, signature, 1)
          p.write_text(s)
          PY

      - name: Verify decommission
        shell: bash
        run: |
          python -m py_compile voice_assistant/agent.py voice_assistant/engine_entry.py voice_assistant/local_tts.py
          python - <<'PY'
          from pathlib import Path
          agent = Path('voice_assistant/agent.py').read_text()
          engine = Path('voice_assistant/engine_entry.py').read_text()
          project = Path('pyproject.toml').read_text()
          required = [
              'def text_to_speech_piper(',
              'OpenAI TTS generation failed; using Piper:',
              'ElevenLabs TTS generation failed; using Piper:',
              'backend_provider="piper"',
              'speak_local_status(text, values)',
          ]
          missing = [item for item in required if item not in agent]
          if missing:
              raise SystemExit(f'missing Piper migration invariants: {missing}')
          if '_install_offline_piper_adapter' in engine:
              raise SystemExit('legacy engine_entry Piper monkey-patch remains')
          if 'pyttsx3' in project.lower():
              raise SystemExit('legacy pyttsx3 dependency remains in pyproject.toml')
          PY
          if grep -Rni --exclude-dir=.git --exclude=decommission-pyttsx3.yml --exclude=fix-decommission-migration.yml --exclude=decommission_pyttsx3_migration.py --exclude='*.pyc' 'pyttsx3' .; then
            echo 'Legacy pyttsx3 references remain.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voice_assistant/agent.py voice_assistant/engine_entry.py pyproject.toml AGENT.md
          git commit -m 'tts: fully decommission pyttsx3 in favor of Piper [skip ci]'
          git push origin HEAD:realtime-voice-architecture
