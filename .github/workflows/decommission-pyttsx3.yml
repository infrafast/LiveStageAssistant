name: Decommission legacy pyttsx3

on:
  push:
    branches: [realtime-voice-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0

      - name: Migrate Classic local fallback to Piper
        run: python scripts/decommission_pyttsx3_migration.py

      - name: Verify decommission
        shell: bash
        run: |
          python -m py_compile voice_assistant/agent.py voice_assistant/engine_entry.py voice_assistant/local_tts.py
          python -m unittest tests.test_realtime_mcp_auto
          if grep -Rni --exclude-dir=.git --exclude=decommission-pyttsx3.yml --exclude=fix-decommission-migration.yml --exclude=decommission_pyttsx3_migration.py --exclude='*.pyc' 'pyttsx3' .; then
            echo 'Legacy pyttsx3 references remain.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voice_assistant/agent.py voice_assistant/engine_entry.py pyproject.toml AGENT.md
          git commit -m 'tts: fully decommission pyttsx3 in favor of Piper [skip ci]'
          git push origin HEAD:realtime-voice-architecture
