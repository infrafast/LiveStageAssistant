name: Decommission legacy system TTS

on:
  push:
    branches: [realtime-voice-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0

      - name: Migrate Classic local fallback to Piper
        run: python scripts/decommission_pyttsx3_migration.py

      - name: Normalize asserted block boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('voice_assistant/agent.py')
          s = p.read_text()
          duplicate_class = 'class AutoNetworkMonitor:\n\n\nclass AutoNetworkMonitor:\n'
          signature = '    def play_local_tts_file(self, audio_path: str | Path, *, stop_event: threading.Event | None = None) -> None:\n'
          duplicate_method = signature + '\n' + signature
          if s.count(duplicate_class) != 1:
              raise SystemExit(f'expected one duplicated AutoNetworkMonitor boundary, found {s.count(duplicate_class)}')
          if s.count(duplicate_method) != 1:
              raise SystemExit(f'expected one duplicated local-TTS method boundary, found {s.count(duplicate_method)}')
          s = s.replace(duplicate_class, 'class AutoNetworkMonitor:\n', 1)
          s = s.replace(duplicate_method, signature, 1)
          p.write_text(s)
          PY

      - name: Clean configuration documentation tests and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '.env.online': [
                  ('# Backend cloud TTS can fall back to pyttsx3; browser/web TTS never falls back to pyttsx3.', '# Backend cloud TTS falls back to local Piper; browser/web TTS does not perform a backend fallback.'),
              ],
              '.env.codespace': [
                  ('# Backend cloud TTS can fall back to pyttsx3; browser/web TTS never falls back to pyttsx3.', '# Backend cloud TTS falls back to local Piper; browser/web TTS does not perform a backend fallback.'),
              ],
              'raspi_service_pack_stdio/.env.online': [
                  ('# Backend cloud TTS can fall back to pyttsx3; browser/web TTS never falls back to pyttsx3.', '# Backend cloud TTS falls back to local Piper; browser/web TTS does not perform a backend fallback.'),
              ],
              'container/config/.env.localhost': [
                  ('# Backend cloud TTS can fall back to pyttsx3; browser/web TTS never falls back to pyttsx3.', '# Backend cloud TTS falls back to local Piper; browser/web TTS does not perform a backend fallback.'),
                  ('# pyttsx3/local speaker output requires working /dev/snd passthrough.', '# Piper/backend speaker output requires working /dev/snd passthrough.'),
              ],
              'container/config/.env.infrafast': [
                  ('# Backend cloud TTS can fall back to pyttsx3; browser/web TTS never falls back to pyttsx3.', '# Backend cloud TTS falls back to local Piper; browser/web TTS does not perform a backend fallback.'),
                  ('# pyttsx3/local speaker output requires working /dev/snd passthrough.', '# Piper/backend speaker output requires working /dev/snd passthrough.'),
              ],
              'assets/web/index.html': [
                  ('TTS: local pyttsx3', 'TTS: local Piper'),
              ],
              'voice_assistant/local_tts.py': [
                  ('selection layer and no pyttsx3 fallback in this module.', 'selection layer and no legacy system-TTS fallback in this module.'),
              ],
              'AGENT.md': [
                  ('`TTS_PROVIDER=pyttsx3`, or a pyttsx3 fallback', 'a legacy local TTS provider token or fallback'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          installer = Path('raspi_service_pack_stdio/install_livestageassistant_service.sh')
          text = installer.read_text()
          old = 'remove_env_key "$OFFLINE_ENV" "LOCAL_TTS_PYTTSX3_FALLBACK"\n'
          new = 'sudo sed -i \'/^LOCAL_TTS_.*FALLBACK=/d\' "$OFFLINE_ENV"\n'
          if text.count(old) != 1:
              raise SystemExit('Raspberry legacy fallback migration line not found exactly once')
          installer.write_text(text.replace(old, new, 1))

          roadmap = Path('docs/ARCHITECTURE_AND_ROADMAP.md')
          text = roadmap.read_text()
          pairs = [
              ('OR3 is now Pi-validated and no longer configures or falls back to pyttsx3.', 'OR3 is Pi-validated; Piper is the only local speech implementation and the fallback for backend cloud-TTS failures.'),
              ('The large historical Classic `agent.py` still contains a pyttsx3 implementation for legacy non-OR3 paths. That implementation is outside the OR3 configuration contract and must not be reintroduced into offline profiles or used as an OR3 fallback. A future Classic cleanup may remove it separately once all legacy callers are audited.', 'Classic now uses Piper natively for local speech and as the fallback for backend OpenAI/ElevenLabs TTS failures, including missing credentials, quota/auth/rate failures, generation failures and backend playback failures. The historical system-TTS implementation and dependency have been removed.'),
              ('24. Offline/local TTS configuration is owned solely by `LOCAL_TTS_PROVIDER`; OR3 must not require `TTS_PROVIDER=pyttsx3` or a pyttsx3 fallback.', '24. Piper is the implicit and only local TTS implementation; offline profiles have no local-provider selector, and backend cloud-TTS failures fall back to Piper.'),
              ('- [x] offline TTS configuration uses only `LOCAL_TTS_PROVIDER`; the obsolete `TTS_PROVIDER=pyttsx3` + fallback combination is removed.', '- [x] offline TTS is implicit Piper with no local-provider selector or legacy system-TTS fallback configuration.'),
              ('- [x] offline configuration is now owned exclusively by `LOCAL_TTS_PROVIDER=piper`; `TTS_PROVIDER=pyttsx3` and `LOCAL_TTS_PYTTSX3_FALLBACK` are removed from OR3 profiles and migration;', '- [x] Piper is implicit as the sole local TTS; offline profiles contain only Piper tuning/model keys and no local-provider selector;'),
              ('- [x] remove pyttsx3 as an OR3 emergency fallback now that Piper is Pi-validated;', '- [x] remove the historical system-TTS implementation as an OR3 fallback after Piper Pi validation;'),
              ('Implementation note (2026-09-06): `voice_assistant/local_tts.py` owns Piper model loading/rendering and critical local status speech. The default voice is `fr_FR-siwis-medium` under `data/piper`. `engine_entry.py` adapts the historical Classic local-output hook to Piper only for offline sessions so the large Classic provider surface does not need to be rewritten in OR3. The legacy method name in `agent.py` remains an internal compatibility hook, but OR3 no longer configures or executes pyttsx3 fallback behavior. `scripts/install.sh` and `scripts/install.ps1` install `piper-tts` and download the default French model/config. The Raspberry service installer migrates existing offline profiles by removing `TTS_PROVIDER` and `LOCAL_TTS_PYTTSX3_FALLBACK` and preserving site-specific settings.', 'Implementation note (2026-09-06): `voice_assistant/local_tts.py` owns Piper model loading/rendering and critical local status speech. The default voice is `fr_FR-siwis-medium` under `data/piper`. Classic now owns Piper natively in `agent.py`; `engine_entry.py` no longer monkey-patches a historical local-TTS hook. Backend OpenAI/ElevenLabs TTS failures fall back to Piper. `scripts/install.sh` and `scripts/install.ps1` install `piper-tts` and download the default French model/config. The Raspberry service installer removes obsolete local-TTS selector/fallback keys while preserving site-specific settings.'),
          ]
          for old, new in pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'roadmap replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          roadmap.write_text(text)
          PY

      - name: Regenerate dependency lock without legacy system TTS
        shell: bash
        run: |
          python -m pip install --quiet uv
          uv lock

      - name: Verify decommission
        shell: bash
        run: |
          python -m py_compile voice_assistant/agent.py voice_assistant/engine_entry.py voice_assistant/local_tts.py tests/test_offline_reliability.py
          python - <<'PY'
          from pathlib import Path
          agent = Path('voice_assistant/agent.py').read_text()
          engine = Path('voice_assistant/engine_entry.py').read_text()
          project = Path('pyproject.toml').read_text()
          lock = Path('uv.lock').read_text()
          required = [
              'def text_to_speech_piper(',
              'OpenAI TTS generation failed; using Piper:',
              'OpenAI TTS playback failed; using Piper:',
              'ElevenLabs TTS generation failed; using Piper:',
              'ElevenLabs TTS playback failed; using Piper:',
              'backend_provider="piper"',
              'speak_local_status(text, values)',
          ]
          missing = [item for item in required if item not in agent]
          if missing:
              raise SystemExit(f'missing Piper migration invariants: {missing}')
          forbidden_agent = ['import pyttsx3', 'TTS_ENGINE', 'text_to_speech_pyttsx3', 'TTS_PROVIDER"] = "pyttsx3"']
          present = [item for item in forbidden_agent if item in agent]
          if present:
              raise SystemExit(f'legacy system-TTS implementation remains: {present}')
          if '_install_offline_piper_adapter' in engine:
              raise SystemExit('legacy engine_entry Piper monkey-patch remains')
          if 'pyttsx3' in project.lower() or 'pyttsx3' in lock.lower():
              raise SystemExit('legacy system-TTS dependency remains in project or lock')
          PY
          if grep -Rni --exclude-dir=.git --exclude=decommission-pyttsx3.yml --exclude=fix-decommission-migration.yml --exclude=decommission_pyttsx3_migration.py --exclude='*.pyc' 'pyttsx3' .; then
            echo 'Legacy system-TTS references remain.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voice_assistant/agent.py voice_assistant/engine_entry.py voice_assistant/local_tts.py pyproject.toml uv.lock AGENT.md .env.online .env.codespace raspi_service_pack_stdio/.env.online raspi_service_pack_stdio/install_livestageassistant_service.sh container/config/.env.localhost container/config/.env.infrafast assets/web/index.html docs/ARCHITECTURE_AND_ROADMAP.md tests/test_offline_reliability.py
          git commit -m 'tts: fully decommission legacy system TTS in favor of Piper [skip ci]'
          git push origin HEAD:realtime-voice-architecture
