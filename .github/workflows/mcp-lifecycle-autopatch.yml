name: MCP lifecycle autopatch

on:
  push:
    branches:
      - fix/mcp-lifecycle-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-lifecycle-cleanup

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply lifecycle hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agent = Path('voice_assistant/agent.py')
          text = agent.read_text(encoding='utf-8')
          old_cleanup = '''            if reload_requested and self.mcp_client and self.mcp_client.sessions:\n                print("MCP cleanup deferred for reload.")\n            elif self.mcp_client and self.mcp_client.sessions:\n                try:\n                    await asyncio.wait_for(self.mcp_client.close_all_sessions(), timeout=3.0)\n                except Exception as e:\n                    print(f"MCP cleanup timed out or failed: {e}")\n'''
          new_cleanup = '''            if self.mcp_client and self.mcp_client.sessions:\n                try:\n                    await asyncio.wait_for(self.mcp_client.close_all_sessions(), timeout=6.0)\n                except Exception as e:\n                    print(f"MCP cleanup timed out or failed: {e}")\n'''
          if old_cleanup not in text:
              raise SystemExit('Expected MCP reload cleanup block was not found')
          text = text.replace(old_cleanup, new_cleanup, 1)

          old_signal = '''if __name__ == "__main__":\n    signal.signal(signal.SIGINT, request_force_exit)\n'''
          new_signal = '''if __name__ == "__main__":\n    signal.signal(signal.SIGINT, request_force_exit)\n    signal.signal(signal.SIGTERM, request_force_exit)\n'''
          if old_signal not in text:
              raise SystemExit('Expected SIGINT registration was not found')
          text = text.replace(old_signal, new_signal, 1)
          agent.write_text(text, encoding='utf-8')

          service = Path('raspi_service_pack_stdio/livestageassistant.service')
          service_text = service.read_text(encoding='utf-8')
          if 'KillMode=' in service_text:
              raise SystemExit('KillMode already exists; review patch manually')
          marker = 'RestartSec=5\n'
          if marker not in service_text:
              raise SystemExit('Expected RestartSec marker was not found')
          service_text = service_text.replace(marker, marker + 'KillMode=control-group\n', 1)
          service.write_text(service_text, encoding='utf-8')

          test = Path('tests/test_mcp_process_lifecycle.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass McpProcessLifecycleTests(unittest.TestCase):\n    def test_agent_closes_mcp_sessions_on_reload_and_shutdown(self):\n        source = (ROOT / "voice_assistant" / "agent.py").read_text(encoding="utf-8")\n        self.assertNotIn("MCP cleanup deferred for reload.", source)\n        self.assertIn("close_all_sessions(), timeout=6.0", source)\n        self.assertIn("signal.signal(signal.SIGTERM, request_force_exit)", source)\n\n    def test_systemd_kills_the_entire_service_control_group(self):\n        service = (ROOT / "raspi_service_pack_stdio" / "livestageassistant.service").read_text(encoding="utf-8")\n        self.assertIn("KillMode=control-group", service)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile voice_assistant/agent.py
          python tests/test_mcp_process_lifecycle.py

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mcp-lifecycle-autopatch.yml
          git add voice_assistant/agent.py raspi_service_pack_stdio/livestageassistant.service tests/test_mcp_process_lifecycle.py
          git commit -m "fix: harden stdio MCP process lifecycle"
          git push origin HEAD:fix/mcp-lifecycle-cleanup
