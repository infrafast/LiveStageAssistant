name: Apply streaming wake trigger chunk fix

on:
  push:
    branches: [main]
    paths:
      - scripts/_apply_streaming_wake_trigger_chunk_fix.py
      - .github/workflows/apply-streaming-wake-trigger-chunk-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/_apply_streaming_wake_trigger_chunk_fix.py
      - name: Verify syntax and invariants
        run: |
          python -m py_compile voice_assistant/agent.py
          python - <<'PY'
          from pathlib import Path
          text = Path('voice_assistant/agent.py').read_text(encoding='utf-8')
          assert 'streaming_pre_wake_frame = False' in text
          block = text.split('if detection:', 1)[1].split('probabilities = self.vad.process_pcm(vad_data)', 1)[0]
          assert 'continue' not in block
          assert 'pre_roll = []' in block
          assert 'self.vad.reset()' in block
          PY
          git diff --check
      - name: Commit validated fix and remove temporary helpers
        run: |
          rm scripts/_apply_streaming_wake_trigger_chunk_fix.py .github/workflows/apply-streaming-wake-trigger-chunk-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve command start in wake trigger chunk'
          git push
