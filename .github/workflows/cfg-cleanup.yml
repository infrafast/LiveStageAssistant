name: CFG final cleanup

on:
  push:
    branches: [realtime-voice-architecture]

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ !contains(github.event.head_commit.message, '[cfg-cleanup]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('voice_assistant/runtime_web_services.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''        automatic_profiles: bool = True,\n        request_reload: Callable[[], None] | None = None,\n''', '''        automatic_profiles: bool = True,\n''')
          s = s.replace('''        self.automatic_profiles = bool(automatic_profiles)\n        self.request_reload = request_reload\n        self._lock = threading.RLock()\n''', '''        self.automatic_profiles = bool(automatic_profiles)\n        self._lock = threading.RLock()\n''')
          s = s.replace('''    def _reload(self) -> None:\n        if self.request_reload is not None:\n            self.request_reload()\n\n''', '')
          s = s.replace('''        \"\"\"Persist the legacy GUI form into the active runtime profile.\"\"\"''', '''        \"\"\"Persist the unified GUI configuration into the active runtime profile.\"\"\"''')
          if 'request_reload' in s or 'def _reload(' in s or 'legacy GUI' in s:
              raise SystemExit('dead reload compatibility remains')
          p.write_text(s, encoding='utf-8')

          p = Path('assets/web/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''    let runtimeRestarting = false;\n    let restartLoadingSeen = false;\n''', '''    let runtimeRestarting = false;\n''')
          s = s.replace('''      runtimeRestarting = true;\n      restartLoadingSeen = false;\n''', '''      runtimeRestarting = true;\n''')
          old = '''        if (runtimeRestarting) {\n          if (environmentLoading.active) restartLoadingSeen = true;\n          if (restartLoadingSeen && !environmentLoading.active && data.runtime_status?.ready) {\n            runtimeRestarting = false;\n            restartRequired = false;\n            restartLoadingSeen = false;\n            llmMessage.textContent = \"Restart complete.\";\n            llmControlsInitialized = false;\n            configBaseline = configSignature();\n            syncConfigActionState();\n          }\n        }'''
          new = '''        if (runtimeRestarting && !environmentLoading.active && data.runtime_status?.ready) {\n          runtimeRestarting = false;\n          restartRequired = false;\n          llmMessage.textContent = \"Restart complete.\";\n          llmControlsInitialized = false;\n          configBaseline = configSignature();\n          syncConfigActionState();\n        }'''
          if old not in s:
              raise SystemExit('restart completion block not found')
          s = s.replace(old, new, 1)
          if 'restartLoadingSeen' in s:
              raise SystemExit('obsolete restart state remains')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python -m py_compile voice_assistant/runtime_web_services.py voice_assistant/web_monitor.py voice_assistant/web_monitor_base.py
          node --check assets/web/app.js
          ! grep -q 'request_reload' voice_assistant/runtime_web_services.py
          ! grep -q 'restartLoadingSeen' assets/web/app.js
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/web/app.js voice_assistant/runtime_web_services.py
          git diff --cached --quiet && exit 0
          git commit -m "cfg: remove obsolete reload compatibility [cfg-cleanup]"
          git push origin HEAD:realtime-voice-architecture
