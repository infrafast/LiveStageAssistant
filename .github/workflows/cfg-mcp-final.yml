name: CFG MCP final

on:
  push:
    branches: [realtime-voice-architecture]

permissions:
  contents: write

jobs:
  implement:
    if: "${{ !contains(github.event.head_commit.message, '[cfg-mcp-final]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Implement
        run: python .github/cfg_mcp_final.py
      - name: Validate
        shell: bash
        run: |
          python -m py_compile voice_assistant/mcp_config_web.py voice_assistant/mcp_realtime_web_endpoint.py voice_assistant/runtime_status.py voice_assistant/classic_engine.py voice_assistant/realtime/service.py voice_assistant/web_monitor.py
          node --check assets/web/app.js
          python - <<'PY'
          from voice_assistant.runtime_status import MCPRuntimeStatus
          x = MCPRuntimeStatus(name='x', configured_transport='stdio', effective_transport='stdio', permission='open')
          assert x.enabled is True
          PY
          grep -q '/api/mcp-test' assets/web/app.js
          grep -q 'mcp_registry' assets/web/app.js
          grep -q 'mcp_registry' voice_assistant/web_monitor.py
          grep -q 'enabled: enabled.checked' assets/web/app.js
          grep -q 'HTTPS auth:' assets/web/app.js
          grep -q 'entry.get("enabled", True) is not False' voice_assistant/classic_engine.py
          grep -q 'server.raw_entry.get("enabled", True) is not False' voice_assistant/realtime/service.py
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/web/app.js voice_assistant/mcp_config_web.py voice_assistant/mcp_realtime_web_endpoint.py voice_assistant/runtime_status.py voice_assistant/classic_engine.py voice_assistant/realtime/service.py voice_assistant/web_monitor.py
          git diff --cached --quiet && exit 0
          git commit -m "cfg: finalize MCP registry CRUD health and secrets [cfg-mcp-final]"
          git push origin HEAD:realtime-voice-architecture
