          old = '''                    speaker_profiles = payload.get("speaker_profiles") or []
                    if not isinstance(speaker_profiles, list):'''
          new = '''                    speaker_profiles = payload.get("speaker_profiles") or []
                    voice_engine = str(payload.get("voice_engine") or "").strip().lower()
                    realtime_model = str(payload.get("realtime_model") or "").strip()
                    realtime_voice = str(payload.get("realtime_voice") or "").strip()
                    try:
                        cloud_tts_output_gain = float(payload.get("cloud_tts_output_gain") if payload.get("cloud_tts_output_gain") is not None else 1.0)
                        local_tts_output_gain = float(payload.get("local_tts_output_gain") if payload.get("local_tts_output_gain") is not None else 1.0)
                    except (TypeError, ValueError):
                        self.send_error(400, "Speech output gains must be numbers")
                        return
                    if not isinstance(speaker_profiles, list):'''
          base = replace_once(base, old, new, 'base parse CFG')
          old = '''                            speaker_margin,
                            speaker_profiles,
                        )'''
          new = '''                            speaker_margin,
                            speaker_profiles,
                            voice_engine,
                            realtime_model,
                            realtime_voice,
                            cloud_tts_output_gain,
                            local_tts_output_gain,
                        )'''
          base = replace_once(base, old, new, 'base call CFG')
          p.write_text(base, encoding='utf-8')

          # ---- runtime_web_services.py: one atomic profile save, never auto-reload ----
          p = Path('voice_assistant/runtime_web_services.py')
          svc = p.read_text(encoding='utf-8')
          old = '''            "selected_command_ack_sound_file": command_ack,
            "message": f"Common runtime options loaded from active profile: {self.active_profile()}",
        }'''
          new = '''            "selected_command_ack_sound_file": command_ack,
            "selected_voice_engine": str(values.get("VOICE_ENGINE") or ("local" if connectivity == "offline" else "classic")).strip().lower(),
            "selected_realtime_model": str(values.get("OPENAI_REALTIME_MODEL") or "gpt-realtime-2.1").strip(),
            "selected_realtime_voice": str(values.get("OPENAI_REALTIME_VOICE") or "marin").strip(),
            "selected_cloud_tts_output_gain": self._float(values, "CLOUD_TTS_OUTPUT_GAIN", 1.0),
            "selected_local_tts_output_gain": self._float(values, "LOCAL_TTS_OUTPUT_GAIN", 1.0),
            "message": f"Common runtime options loaded from active profile: {self.active_profile()}",
        }'''
          svc = replace_once(svc, old, new, 'options CFG')

          old = '''        speaker_margin: float,
        speaker_profiles: list[dict[str, Any]],
    ) -> dict[str, Any]:'''
          new = '''        speaker_margin: float,
        speaker_profiles: list[dict[str, Any]],
        voice_engine: str,
        realtime_model: str,
        realtime_voice: str,
        cloud_tts_output_gain: float,
        local_tts_output_gain: float,
    ) -> dict[str, Any]:'''
          svc = replace_once(svc, old, new, 'save signature CFG')

          old = '''        updates = {
            "LLM_PROVIDER": provider,'''
          new = '''        requested_engine = str(voice_engine or ("local" if active_connectivity == "offline" else "classic")).strip().lower()
        allowed_engines = {"local"} if active_connectivity == "offline" else {"classic", "openai-realtime"}
        if requested_engine not in allowed_engines:
            raise ValueError(f"voice_engine must be one of: {', '.join(sorted(allowed_engines))}")
        cloud_tts_output_gain = max(0.0, min(2.0, float(cloud_tts_output_gain)))
        local_tts_output_gain = max(0.0, min(2.0, float(local_tts_output_gain)))
        if requested_engine == "openai-realtime":
            realtime_model = str(realtime_model or "gpt-realtime-2.1").strip()
            realtime_voice = str(realtime_voice or "marin").strip()
            if not realtime_model or not realtime_voice:
                raise ValueError("Realtime model and voice are required")

        updates = {
            "VOICE_ENGINE": requested_engine,
            "CLOUD_TTS_OUTPUT_GAIN": f"{cloud_tts_output_gain:.2f}",
            "LOCAL_TTS_OUTPUT_GAIN": f"{local_tts_output_gain:.2f}",
            "LLM_PROVIDER": provider,'''
          svc = replace_once(svc, old, new, 'save update CFG')

          old = '''        if provider == "ollama":
            updates["OLLAMA_MODEL"] = model'''
          new = '''        if requested_engine == "openai-realtime":
            updates["OPENAI_REALTIME_MODEL"] = realtime_model
            updates["OPENAI_REALTIME_VOICE"] = realtime_voice
        if provider == "ollama":
            updates["OLLAMA_MODEL"] = model'''
          svc = replace_once(svc, old, new, 'realtime fields')

          old = '''        with self._lock:
            self._write_env(self.active_profile(), updates)
            self._refresh_monitor_config()
            self._reload()
        return {
            "saved": True,
            "provider": provider,
            "model": model,
            "connectivity_mode": active_connectivity,
            "restart_required": True,
            "message": "Configuration saved. Restart LiveStageAssistant to apply it.",
        }'''
          new = '''        with self._lock:
            profile = self.active_profile()
            self._write_env(profile, updates)
            self._refresh_monitor_config()
        return {
            "saved": True,
            "provider": provider,
            "model": model,
            "voice_engine": requested_engine,
            "connectivity_mode": active_connectivity,
            "profile": str(profile),
            "restart_required": True,
            "message": f"Saved to {profile} · restart required.",
        }'''
          svc = replace_once(svc, old, new, 'no auto reload')
          svc = svc.replace('''            self._write_json_atomic(path, config)
            self._refresh_monitor_config(mcp_config=config)
            self._reload()
        return {"ok": True, "mcp_config": str(path), "routing": normalized, "restart_required": True}''', '''            self._write_json_atomic(path, config)
            self._refresh_monitor_config(mcp_config=config)
        return {"ok": True, "mcp_config": str(path), "routing": normalized, "restart_required": True}''')
          svc = svc.replace('''            self._write_json_atomic(path, config)
            self._refresh_monitor_config(mcp_config=config)
            self._reload()
        return {"ok": True, "mcp_config": str(path), "options": normalized, "restart_required": True}''', '''            self._write_json_atomic(path, config)
            self._refresh_monitor_config(mcp_config=config)
        return {"ok": True, "mcp_config": str(path), "options": normalized, "restart_required": True}''')
          p.write_text(svc, encoding='utf-8')

          # ---- web_monitor.py: remove now-dead voice-specific persistence endpoints ----
          p = Path('voice_assistant/web_monitor.py')
          wm = p.read_text(encoding='utf-8')
          wm = re.sub(r'\nVOICE_ENGINE_ONLINE = .*?\nDEFAULT_REALTIME_VOICE = "marin"\n', '\n', wm, count=1, flags=re.S)
          wm = re.sub(r'\n\ndef _auto_env_dir\(\).*?\n\ndef _runtime_status_file\(\)', '\n\ndef _runtime_status_file()', wm, count=1, flags=re.S)
          wm = re.sub(r'\n\ndef _bounded_gain\(.*?\n\ndef _display_transport\(', '\n\ndef _display_transport(', wm, count=1, flags=re.S)
          wm = re.sub(r'\n    def _save_voice_engine\(.*?\n    def _request_runtime_restart\(', '\n    def _request_runtime_restart(', wm, count=1, flags=re.S)
          wm = wm.replace('{"/api/mcp-realtime-policy", "/api/mcp-server", "/api/voice-engine", "/api/voice-output-gains", "/api/runtime-restart"}', '{"/api/mcp-realtime-policy", "/api/mcp-server", "/api/runtime-restart"}')
          wm = re.sub(r'\n                        if parsed\.path == "/api/voice-engine":.*?if parsed\.path == "/api/runtime-restart":', '\n                        if parsed.path == "/api/runtime-restart":', wm, count=1, flags=re.S)
          wm = re.sub(r'\n                    def _handle_voice_engine_save\(self\).*?\n                    def _handle_runtime_restart\(self\)', '\n                    def _handle_runtime_restart(self)', wm, count=1, flags=re.S)
          if '/api/voice-engine' in wm or '/api/voice-output-gains' in wm or '_save_voice_engine' in wm or '_save_voice_output_gains' in wm:
              raise SystemExit('web_monitor still contains dead voice persistence endpoints')
          p.write_text(wm, encoding='utf-8')

          # Structural assertions.
          assert 'voice-config-save' not in Path('assets/web/index.html').read_text()
          assert 'loadCfg9' not in Path('assets/web/index.html').read_text()
          assert Path('assets/web/index.html').read_text().count('/assets/web/app.js') == 1
          assert 'Save + Restart' in Path('assets/web/app.js').read_text()
          assert '/api/runtime-restart' in Path('assets/web/app.js').read_text()
          assert '/api/voice-engine' not in Path('assets/web/app.js').read_text()
          PY
      - name: Validate
        shell: bash
        run: |
          python -m py_compile voice_assistant/runtime_web_services.py voice_assistant/web_monitor.py voice_assistant/web_monitor_base.py
          node --check assets/web/app.js
          python tests/test_web_config_architecture.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/web/app.js assets/web/index.html voice_assistant/runtime_web_services.py voice_assistant/web_monitor_base.py voice_assistant/web_monitor.py
          git diff --cached --quiet && exit 0
          git commit -m "cfg: canonicalize save and restart state [cfg-refactor]"
          git push origin HEAD:realtime-voice-architecture
