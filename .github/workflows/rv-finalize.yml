name: RV finalization

on:
  push:
    branches: [realtime-voice-architecture]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ !contains(github.event.head_commit.message, '[rv-final]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused runtime dependencies
        run: python -m pip install -q numpy websockets python-dotenv
      - name: Apply RV finalization
        run: |
          python .github/rv_finalize.py
          sed -i 's/_maybe_continue_after_native_mcp/_maybe_continue_after_tools/g' tests/test_openai_realtime_adapter.py
      - name: Validate syntax and focused tests
        run: |
          python -m compileall -q voice_assistant
          node --check assets/web/app.js
          python -m unittest tests.test_realtime_provider_factory tests.test_realtime_browser_auth tests.test_openai_realtime_adapter tests.test_realtime_wake_gate tests.test_semantic_audio
      - name: Structural invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('voice_assistant/realtime/service.py').read_text()
          runtime = Path('voice_assistant/runtime.py').read_text()
          web = Path('voice_assistant/web_monitor.py').read_text()
          app = Path('assets/web/app.js').read_text()
          assert 'create_realtime_engine' in service
          assert 'REALTIME_RECONNECT_ATTEMPTS' in service
          assert 'gemini-live' in runtime
          assert '/api/realtime-browser-secret' in web
          assert 'RTCPeerConnection' in app
          assert 'app-main.js' not in app
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_assistant assets/web .env.example docs tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "rv: complete provider robustness wake semantics and browser path [rv-final]"
          git push origin HEAD:realtime-voice-architecture
