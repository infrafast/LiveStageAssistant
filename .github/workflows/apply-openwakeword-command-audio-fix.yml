name: Apply wakeword fix

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-openwakeword-command-audio-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/_apply_openwakeword_command_audio_fix.py
      - run: python -m py_compile voice_assistant/agent.py
      - run: git diff --check
      - run: |
          rm .github/workflows/apply-openwakeword-command-audio-fix.yml scripts/_apply_openwakeword_command_audio_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_assistant/agent.py README.md docs/ARCHITECTURE.md .github/workflows/apply-openwakeword-command-audio-fix.yml scripts/_apply_openwakeword_command_audio_fix.py
          git commit -m "fix: keep streaming wake word out of STT command audio"
          git push origin HEAD:main
