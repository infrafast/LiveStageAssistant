name: Apply offline reliability fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-offline-reliability-fix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PortAudio headers
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Apply patch
        run: python scripts/_apply_offline_reliability_fix.py
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Verify Python and targeted tests
        run: |
          python -m py_compile voice_assistant/agent.py voice_assistant/stage_timeout.py
          pytest -q tests/test_offline_reliability.py tests/test_stage_timeouts.py tests/test_mcp_process_lifecycle.py
          git diff --check
      - name: Commit validated changes and remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/_apply_offline_reliability_fix.py .github/workflows/apply-offline-reliability-fix.yml
          git add -A
          git commit -m 'fix: harden offline auto switching and shutdown'
          git push
