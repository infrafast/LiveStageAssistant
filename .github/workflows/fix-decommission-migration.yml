name: Fix and dispatch pyttsx3 migration

on:
  push:
    branches: [realtime-voice-architecture]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0
      - name: Fix migration block boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/decommission_pyttsx3_migration.py')
          s = p.read_text()
          old_auto = '''        speak_local_status(text, values)\\n\\n\\nclass AutoNetworkMonitor:\\n''',\n    "auto network speech",\n)'''
          new_auto = '''        speak_local_status(text, values)\\n\\n''',\n    "auto network speech",\n)'''
          old_tts = '''    def play_local_tts_file(self, audio_path: str | Path, *, stop_event: threading.Event | None = None) -> None:\\n''',\n    "backend TTS implementation",\n)'''
          new_tts = '''''',\n    "backend TTS implementation",\n)'''
          if s.count(old_auto) != 1:
              raise SystemExit(f'auto block target count={s.count(old_auto)}')
          if s.count(old_tts) != 1:
              raise SystemExit(f'TTS block target count={s.count(old_tts)}')
          s = s.replace(old_auto, new_auto, 1).replace(old_tts, new_tts, 1)
          p.write_text(s)
          PY
          python -m py_compile scripts/decommission_pyttsx3_migration.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/decommission_pyttsx3_migration.py
          git commit -m 'ci: fix pyttsx3 migration block boundaries [skip ci]'
          git push origin HEAD:realtime-voice-architecture
      - name: Dispatch corrected migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run decommission-pyttsx3.yml --ref realtime-voice-architecture
