name: CFG canonical refactor runner

on:
  push:
    branches:
      - realtime-voice-architecture

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ !contains(github.event.head_commit.message, '[cfg-refactor]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute canonical refactor
        run: python .github/cfg_refactor.py
      - name: Validate
        shell: bash
        run: |
          python -m py_compile voice_assistant/runtime_web_services.py voice_assistant/web_monitor.py voice_assistant/web_monitor_base.py
          node --check assets/web/app.js
          grep -q 'DEFAULT_RUNTIME_STATUS_FILE = "/tmp/livestageassistant-runtime-status.json"' voice_assistant/web_monitor.py
          grep -q 'Saved to {profile} · restart required' voice_assistant/runtime_web_services.py
          grep -q 'voice_engine: voiceEngineValue' assets/web/app.js
          grep -q 'Save + Restart' assets/web/app.js
          grep -q '/api/runtime-restart' assets/web/app.js
          ! grep -q 'voice-config-save' assets/web/index.html
          ! grep -q 'loadCfg9' assets/web/index.html
          ! grep -q '/api/voice-engine' assets/web/app.js
          ! grep -q '/api/voice-output-gains' assets/web/app.js
          ! grep -q 'self._reload()' voice_assistant/runtime_web_services.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/web/app.js assets/web/index.html voice_assistant/runtime_web_services.py voice_assistant/web_monitor_base.py voice_assistant/web_monitor.py
          git diff --cached --quiet && exit 0
          git commit -m "cfg: canonicalize save and restart state [cfg-refactor]"
          git push origin HEAD:realtime-voice-architecture
