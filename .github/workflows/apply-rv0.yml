name: apply-rv0

on:
  push:
    branches:
      - realtime-voice-architecture

permissions:
  contents: write

jobs:
  apply-rv0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-voice-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply RV0 patch
        run: python scripts/_apply_rv0.py
      - name: Validate syntax
        run: python -m py_compile voice_assistant/agent.py voice_assistant/voice_metrics.py voice_assistant/realtime/engine.py scripts/summarize_voice_metrics.py
      - name: Run RV0 unit tests
        run: python -m unittest tests/test_voice_metrics.py tests/test_realtime_engine.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit RV0 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: implement RV0 realtime baseline scaffolding"
          git push origin realtime-voice-architecture
