name: Apply openWakeWord post-TTS guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-openwakeword-post-tts-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: python scripts/_apply_openwakeword_post_tts_guard.py

      - name: Verify syntax and guard invariants
        run: |
          python -m py_compile voice_assistant/agent.py
          python - <<'PY'
          from pathlib import Path
          source = Path('voice_assistant/agent.py').read_text()
          assert 'DEFAULT_BACKEND_WAKE_WORD_POST_TTS_SUPPRESS_MS = 350' in source
          assert 'self.backend_wake_word_suppress_until = 0.0' in source
          assert 'time.monotonic() < self.backend_wake_word_suppress_until' in source
          assert 'self.backend_wake_word_detector.reset(clear_cooldown=True)' in source
          assert 'DEFAULT_BACKEND_WAKE_WORD_POST_TTS_SUPPRESS_MS / 1000.0' in source
          assert 'openWakeWord/VAD input is suppressed for 350 ms' in Path('docs/ARCHITECTURE.md').read_text()
          print('Post-TTS openWakeWord guard invariants verified.')
          PY
          git diff --check

      - name: Commit validated fix and remove temporary helpers
        run: |
          rm .github/workflows/apply-openwakeword-post-tts-guard.yml scripts/_apply_openwakeword_post_tts_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_assistant/agent.py docs/ARCHITECTURE.md .github/workflows/apply-openwakeword-post-tts-guard.yml scripts/_apply_openwakeword_post_tts_guard.py
          git commit -m "fix: suppress wake word tail after backend TTS"
          git push origin HEAD:main
